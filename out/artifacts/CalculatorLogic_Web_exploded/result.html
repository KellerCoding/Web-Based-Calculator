<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <title>Calculator</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<style>
    h1 {text-align: left;}
    h2 {text-align: left;}
    p {text-align: left;}
    div {text-align: left;}
</style>
<body>
<h1>Calculator
    <form action="/" method="GET" id="return">
        <button>Clear</button>
    </form>
</h1><br><br>

<table style="width:100%" th:bgcolor="${color}">
    <tr>
        <th th:text="${oper}" th:color="${textcolor}">
        </th>
    </tr>
    <tr>
        <th th:text="${something}" th:color="${textcolor}">
        </th>
    </tr>
</table>

<form action="/result" method="GET" id="returnHome">
    <div>
        <p>
            <label for="inputA">Values</label>
        <p></p>
        <textarea name="inputA" id="inputA" rows="10" cols="100"></textarea><br><br>
        <h2>Descriptive Statistics</h2>
        <button>Compute Standard Deviation  |  one value per line</button><br><br>
        <button>Compute Population Deviation  |  one value per line</button><br><br>
        <button>Compute Mean  |  one value per line</button><br><br>
        <button>Compute Z Score  |  value, mean, stdDev on one line</button>
        <h2>Single Linear Regression</h2>
        <button>Compute Single Linear Regression Formula | one x,y pair per line</button><br><br>
        <button>Predict Y from Linear Regression Formula | x,m,b on one line</button><br><br>
    </div>
</form>
</body>
</html>

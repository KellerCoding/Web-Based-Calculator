<!DOCTYPE HTML>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Calculator</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<style>
    h1 {text-align: left;}
    h2 {text-align: left;}
    p {text-align: left;}
    div {text-align: left;}
</style>
<body>
<h1>Calculator<form action="" method="GET" id="">
    <button>Clear</button>
</form>
</h1><br>


<table style="width:100%" bgcolor="#FFECD7">
    <tr>
        <th color="#000000" valuetype="text">
            Enter values below, then select an operation
        </th>
    </tr>
    <tr>
        <th >
        </th>
    </tr>
</table>

<form action="/result" method="GET" id="input" >
    <p>
        <label for="inputA">Values</label><br>
        <textarea name="inputA" id="inputA" rows="10" cols="100"></textarea><br><br>
    </p>

    <div th:type="String" th:id="method"  >

        <h2>Descriptive Statistics</h2>
        <button name="method" type="submit" th:id="method" th:value="method" value="compSTD">Compute Sample Standard Deviation  |  one value per line</button><br><br>
        <button name="method" type="submit" th:id="method" th:value="method" value="compPop">Compute Population Deviation  |  one value per line</button><br><br>
        <button name="method" type="submit" th:id="method" th:value="method" value="compMean">Compute Mean  |  one value per line</button><br><br>
        <button name="method" type="submit" th:id="comp" th:value="compZ" value="compZ">Compute Z Score  |  value, mean, stdDev on one line</button>
        <h2>Single Linear Regression</h2>
        <button name="method" type="submit" th:id="comp" th:value="compSingle" value="compSingle">Compute Single Linear Regression Formula | one x,y pair per line</button><br><br>
        <button name="method" type="submit" th:id="comp" th:value="compY" value="compY">Predict Y from Linear Regression Formula | x,m,b on one line</button><br><br>
    </div>
</form>
</body>
</html>
